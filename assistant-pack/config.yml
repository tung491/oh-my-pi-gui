# Pinned settings for every Sai ATLAS session, passed with --config. An overlay wins only for
# the keys it sets, so every approval-relevant key is set here.
temperature: 0.2
# Never resume the folder's newest session on a sessionless start: it could be an old chat or
# coding session the pack cannot run.
autoResume: false
# Local models only: no online provider, no Ollama cloud model, and only an endpoint on this
# computer (needs the sidecar's modelPolicy patch, patches/omp/0003-model-policy-local-only.patch).
modelPolicy:
  providers: [ollama]
  localOnly: true
# No memory backend: Hindsight would send the conversation to a remote service.
memory:
  backend: "off"
# No bash tool is loaded: shellPath and bash.* are inert, kept as a deny-all guard
# for any shell path omp still has.
shellPath: /bin/sh
bash:
  patterns:
    - match: "*"
      approval: deny
  allowCompoundCommands: false
  direnv: "off"
fetch:
  enabled: false
extensions: []
skills:
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: false
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  customDirectories: []
  includeSkills: []
  ignoredSkills: []
# Prompt commands from Claude or OpenCode folders stay out of pack sessions.
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
# The app has no plan mode: never start in it (it also turns a resumed one off).
plan:
  enabled: false
  defaultOnStartup: false
# No MCP server from the user's or the folder's config: a configured server is a program that
# could connect anywhere (needs the sidecar's mcp.enabled patch, patches/omp/0004-mcp-enabled-setting.patch).
mcp:
  enabled: false
  enableProjectConfig: false
# No task tool is loaded; disabledAgents stays as belt-and-braces.
task:
  disabledAgents: [task, sonic, scout, reviewer, security-reviewer]
tools:
  approval:
    write: prompt
    open_item: prompt
    os_setting: prompt
    office_report: prompt
    office_slides: prompt
    office_clean: prompt
    edit: deny
    ast_edit: deny
    eval: deny
    browser: deny
    web_search: deny
    github: deny
