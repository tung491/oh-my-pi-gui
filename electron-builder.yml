appId: vn.io.vif.saiatlas
productName: Sai ATLAS
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp
    to: omp
# `omp://` deep links only work if LaunchServices sees CFBundleURLTypes, which
# this block is the only thing that writes. Without it `open-url` never fires in
# an installed build and the handler in src/main/deep-link.ts is dead code.
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  # electron-builder converts the PNG to ICNS on any build host.
  icon: resources/icon.png
  # Seal the complete bundle even when no Developer ID certificate is available.
  # This preserves macOS's user-override flow instead of presenting the app as damaged.
  identity: "-"
  # The updater looks for Sai-ATLAS-<version>-arm64.dmg (src/main/updater-state.ts).
  artifactName: Sai-ATLAS-${version}-${arch}.${ext}
  target:
    # arm64 only here — x64 builds go through electron-builder.x64.yml, which
    # points extraResources at the x86_64 sidecar (resources/omp.x64) instead of
    # the arm64 one below. Building x64 from this config would ship the wrong-arch
    # sidecar.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Sai ATLAS uses the microphone for voice dictation in the composer.
    # Electron's stock bundle asks for camera and Bluetooth with text that names no
    # app; Sai ATLAS never calls either API, so the prompt a user might see stays honest.
    NSCameraUsageDescription: Sai ATLAS does not use the camera.
    NSBluetoothAlwaysUsageDescription: Sai ATLAS does not use Bluetooth.
    NSBluetoothPeripheralUsageDescription: Sai ATLAS does not use Bluetooth.
    # Two origins only: the loopback stats server and GitHub releases over TLS.
    # Declaring that is stricter than the default, so an accidental remote
    # cleartext request cannot start working because some build set
    # NSAllowsArbitraryLoads.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  notarize: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # UUIDv5 of the old appId sh.omp.gui in electron-builder's namespace, kept so
  # the installer finds an existing omp install and upgrades it in place.
  # Never change or remove it.
  guid: 9d72fc94-91dd-54d1-8fda-3b6e5e8d23f2
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Sai ATLAS
  artifactName: Sai-ATLAS-${version}-setup.${ext}

portable:
  artifactName: Sai-ATLAS-${version}-portable.${ext}

# Linux packages build from electron-builder.linux.yml (bun run package:linux).

publish:
  provider: github
  owner: nornzach
  repo: oh-my-pi-gui

electronLanguages:
  - en
