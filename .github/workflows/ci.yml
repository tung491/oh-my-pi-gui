# Type checks, unit tests and the production GUI build on Ubuntu. A clean
# clone has no monorepo neighbours, so sidecar and package builds stay local
# (README → Release process).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # The Electron binary is installed: tests load electron through electron-store.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      # A clean clone has no sidecar binary; the assistant-pack job covers the pack itself.
      - run: bunx vitest run
        env:
          SKIP_COMPILED: "1"
      - run: bun run build

  # The assistant pack: its unit tests, the build script, and every office file it makes
  # opened in LibreOffice. The compiled-sidecar cases need a local sidecar and stay local.
  assistant-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
      - run: bun run build:pack
      - run: bunx vitest run assistant-pack scripts/build-assistant-pack.test.ts
        env:
          SKIP_COMPILED: "1"
      - run: bunx vitest run assistant-pack/test/visual.test.ts
        env:
          CI_VISUAL: "1"

  # The Tauri core: clippy, the Rust tests, test parity with the Electron suite and
  # the frozen API snapshots (checked with the pinned cargo-public-api). Every check
  # here covers the whole tree, so it holds on main and on any branch. No sidecar
  # is needed: the bundle configs that name it are passed only to package builds.
  tauri-linux:
    runs-on: ubuntu-latest
    env:
      # check-module.sh and the package scripts read cargo from here (scripts/rust-pins.env).
      CARGO_HOME_BIN: /home/runner/.cargo/bin
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install the WebKitGTK build and sandbox packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev build-essential gstreamer1.0-pipewire gstreamer1.0-plugins-good bubblewrap xdg-dbus-proxy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-public-api
            ~/.cargo/bin/cargo-tauri
            src-tauri/target
          key: tauri-linux-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/rust-toolchain.toml', 'scripts/rust-pins.env') }}
          restore-keys: tauri-linux-
      - name: Install the Rust toolchains and cargo tools
        run: |
          source scripts/rust-pins.env
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy
          rustup default "$channel"
          # The API snapshots were generated with exactly this nightly and cargo-public-api.
          rustup toolchain install "$PUBLIC_API_TOOLCHAIN" --profile minimal
          if [ "$(cargo public-api --version 2>/dev/null | awk '{print $2}')" != "$CARGO_PUBLIC_API_VERSION" ]; then
            cargo install cargo-public-api --version "$CARGO_PUBLIC_API_VERSION" --locked --force
          fi
          # check-module.sh exits 1 without cargo tauri.
          if ! cargo tauri --version 2>/dev/null | grep -q '^tauri-cli 2\.'; then
            cargo install tauri-cli --version "^2" --locked --force
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build:pack
      - run: bun run build:renderer:tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Test parity with the Electron suite
        run: for parity in src-tauri/contracts/*.parity.json; do bun scripts/check-test-parity.ts "$(basename "$parity" .parity.json)"; done
      - name: Public API snapshots
        run: bash scripts/check-module.sh snapshots
