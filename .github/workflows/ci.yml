# Type checks, unit tests and the production GUI build on Ubuntu. A clean
# clone has no monorepo neighbours, so sidecar and package builds stay local
# (README → Release process).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # The Electron binary is installed: tests load electron through electron-store.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - run: bun run check:types
      - run: bunx vitest run
      - run: bun run build
