appId: vn.io.vif.saiatlas
productName: Sai ATLAS
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp.exe
    to: omp.exe
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Windows packages are currently unsigned; electron-updater must not require
  # a stable certificate identity for an update check.
  verifyUpdateCodeSignature: false

nsis:
  # UUIDv5 of the old appId sh.omp.gui in electron-builder's namespace, kept so
  # the installer finds an existing omp install and upgrades it in place.
  # Never change or remove it.
  guid: 9d72fc94-91dd-54d1-8fda-3b6e5e8d23f2
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sai ATLAS
  artifactName: Sai-ATLAS-${version}-setup.${ext}

portable:
  artifactName: Sai-ATLAS-${version}-portable.${ext}

publish:
  provider: github
  owner: nornzach
  repo: oh-my-pi-gui

# Windows Chromium locale paks are region-tagged (locales/en-US.pak), unlike
# macOS's en.lproj. A bare `en` matches no file, electron-builder strips every
# pak, and the renderer crashes on launch — a blank window.
electronLanguages:
  - en-US
