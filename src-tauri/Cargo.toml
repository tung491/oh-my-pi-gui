[package]
name = "sai-atlas"
version = "0.9.15"
edition = "2021"
publish = false

[lib]
name = "sai_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Test-only bridge hooks (fault scripts, event injection). Never enabled by a bundle.
e2e-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal"] }
futures-util = "0.3"
thiserror = "2"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
notify = "8"
dirs = "7"
which = "7"
sha2 = "0.10"
hex = "0.4"
regex = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
rusty-leveldb = "4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "socket", "fs", "event"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
gtk = "0.18"
glib = "0.18.5"
gobject-sys = "0.18.0"
webkit2gtk = "2.0.2"
webkit2gtk-sys = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
