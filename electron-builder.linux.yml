# Linux x64 packages: an AppImage and a .deb built from the Linux sidecar.
# Self-contained like electron-builder.win.yml, so the macOS configs keep
# packaging only their own sidecars (resources/omp, resources/omp.x64).
appId: vn.io.vif.saiatlas
productName: Sai ATLAS
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp.linux-x64
    to: omp
  # src/main/app-icons.ts points Linux windows at this for the X11 icon.
  - from: resources/icon.png
    to: icon.png
# Becomes MimeType=x-scheme-handler/omp; in the .desktop entry.
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum
# The deb target requires homepage, which would otherwise come from the git
# remote of whichever fork runs the build.
extraMetadata:
  homepage: https://github.com/tung491/oh-my-pi-gui
# The static AppImage runtime needs no libfuse2 and writes no --no-sandbox
# into Exec; see README → Linux for the AppArmor profile it relies on.
toolsets:
  appimage: "1.0.3"

linux:
  executableName: sai-atlas
  # Names the .desktop file and StartupWMClass after package.json desktopName (the Wayland app_id).
  syncDesktopName: true
  icon: resources/icons
  category: Development
  # Matches the git authorship of the release commits.
  maintainer: "Tung Son Do <dosontung007@gmail.com>"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  executableArgs: []
  artifactName: Sai-ATLAS-${version}-x86_64.${ext}

deb:
  # The default would be the spaced product name, which dpkg rejects.
  packageName: sai-atlas
  artifactName: sai-atlas_${version}_amd64.${ext}

publish:
  provider: github
  owner: tung491
  repo: oh-my-pi-gui

# Linux Chromium locale paks are region-tagged (locales/en-US.pak), as on
# Windows; a bare `en` strips every pak and the renderer starts blank.
electronLanguages:
  - en-US
